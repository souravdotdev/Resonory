name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    # Only the integration tests use it: each creates and drops its own database here.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      # version omitted deliberately — auto-detected from the
      # "packageManager" field in root package.json (pnpm@10.13.1), so
      # there's one source of truth for the pinned pnpm version.
      - uses: pnpm/action-setup@v6

      # Node version read from .nvmrc, the same file local nvm/fnm use.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No Turborepo Remote Cache token is configured, so without this every
      # run starts fully cold. Caching .turbo (the local task-output cache)
      # across runs lets unchanged packages skip re-running entirely.
      - name: Cache Turborepo output
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Check formatting
        run: pnpm format:check

      - name: Lint, type-check, test, build
        run: pnpm exec turbo run lint check-types test build

      - name: Integration tests (Postgres)
        run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint every commit in this PR
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      # Full history: the scan covers every commit, not just the latest.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pinned and checksum-verified, the same version the docs ask for locally.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" gitleaks
          sudo mv gitleaks /usr/local/bin/

      # The backstop for the pre-commit hook (skipped with --no-verify, or not
      # installed): the whole history against .gitleaks.toml, minus .gitleaksignore.
      - name: Scan the repository for secrets
        run: gitleaks git --redact --no-banner --verbose .
